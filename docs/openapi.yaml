openapi: 3.1.0
info:
  title: AI Bounties API
  version: 0.1.0
  description: >
    Phase 1 API for BSV AI Bounties. Live document is also served at GET /openapi.json.
servers:
  - url: http://localhost:8787
paths:
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        '200':
          description: OK
  /v1/bounties:
    get:
      operationId: listBounties
      summary: List bounties
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, claimed, submitted, paid, refunded, cancelled]
        - name: category
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Bounty list
    post:
      operationId: createBounty
      summary: Create / index a bounty
      responses:
        '201':
          description: Created
  /v1/llm/draft-bounty:
    post:
      operationId: draftBounty
      summary: LLM-assisted bounty draft (Grok by default)
      responses:
        '200':
          description: Draft
